<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 351" width="980" height="351" role="img" aria-label="Docker web responses and retained volume data">
  <rect width="980" height="351" rx="14" fill="#0e1822"/>
  <text x="22" y="33" fill="#eef5fb" font-family="monospace" font-size="20" font-weight="bold">Docker web responses and retained volume data</text>
  <text x="22" y="59" fill="#aebdcc" font-family="monospace" font-size="14">E1-1 / CMD verification output / 2026-11-03</text>
  <text x="22" y="88" fill="#83e7c6" font-family="Consolas, D2Coding, monospace" font-size="16" xml:space="preserve">CMD&gt; docker --version</text>
  <text x="22" y="111" fill="#eef5fb" font-family="Consolas, D2Coding, monospace" font-size="16" xml:space="preserve">Docker version 29.9.2, build a82e528</text>
  <text x="22" y="134" fill="#eef5fb" font-family="Consolas, D2Coding, monospace" font-size="16" xml:space="preserve"></text>
  <text x="22" y="157" fill="#83e7c6" font-family="Consolas, D2Coding, monospace" font-size="16" xml:space="preserve">CMD&gt; curl.exe -fsS http://localhost:8081/ | findstr SIMPLE_PAGE</text>
  <text x="22" y="180" fill="#eef5fb" font-family="Consolas, D2Coding, monospace" font-size="16" xml:space="preserve">    &lt;p class="version" id="mount-marker" data-version="SIMPLE_PAGE_V2"&gt;페이지 버전: 2&lt;/p&gt;</text>
  <text x="22" y="203" fill="#eef5fb" font-family="Consolas, D2Coding, monospace" font-size="16" xml:space="preserve"></text>
  <text x="22" y="226" fill="#83e7c6" font-family="Consolas, D2Coding, monospace" font-size="16" xml:space="preserve">CMD&gt; curl.exe -fsS http://localhost:8082/ | findstr SIMPLE_PAGE</text>
  <text x="22" y="249" fill="#eef5fb" font-family="Consolas, D2Coding, monospace" font-size="16" xml:space="preserve">    &lt;p class="version" id="mount-marker" data-version="SIMPLE_PAGE_V1"&gt;페이지 버전: 1&lt;/p&gt;</text>
  <text x="22" y="272" fill="#eef5fb" font-family="Consolas, D2Coding, monospace" font-size="16" xml:space="preserve"></text>
  <text x="22" y="295" fill="#83e7c6" font-family="Consolas, D2Coding, monospace" font-size="16" xml:space="preserve">CMD&gt; docker exec e1-1-volume-after cat /data/memo.txt</text>
  <text x="22" y="318" fill="#eef5fb" font-family="Consolas, D2Coding, monospace" font-size="16" xml:space="preserve">E1-1-volume-proof</text>
</svg>
