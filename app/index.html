<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개발 작업실 · E1-1</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #11191e; color: #edf3f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 600px); padding: 40px 32px; border: 1px solid #354650; border-radius: 16px; background: #19242b; }
    .label { color: #94dec2; font-size: 13px; letter-spacing: .12em; }
    h1 { font-size: clamp(28px, 5vw, 38px); line-height: 1.35; letter-spacing: -.04em; margin: 20px 0; }
    .intro { color: #b0c1c9; line-height: 1.8; }
    .version { margin: 28px 0; padding: 16px 18px; border-left: 3px solid #94dec2; background: #11191e; }
    footer { border-top: 1px solid #354650; padding-top: 20px; font-size: 13px; line-height: 1.8; color: #b0c1c9; }
    a { color: #94dec2; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #94dec2; outline-offset: 5px; }
    .v2-detail { display: none; }
    body:has([data-version="SIMPLE_PAGE_V2"]) {
      color-scheme: light;
      color: #182847;
      background: linear-gradient(135deg, #dbeafe, #f0eaff 65%, #e1f7f0);
    }
    body:has([data-version="SIMPLE_PAGE_V2"]) main {
      background: #fff;
      border: 1px solid #cddaff;
      border-top: 8px solid #5141cc;
      box-shadow: 0 24px 64px #2e367824;
    }
    body:has([data-version="SIMPLE_PAGE_V2"]) :is(.label, a) { color: #4432b7; }
    body:has([data-version="SIMPLE_PAGE_V2"]) :is(.intro, footer) { color: #455475; }
    body:has([data-version="SIMPLE_PAGE_V2"]) footer { border-color: #d9e3f7; }
    body:has([data-version="SIMPLE_PAGE_V2"]) .version {
      border: 0;
      border-radius: 12px;
      background: #5141cc;
      color: #fff;
      font-weight: 700;
    }
    body:has([data-version="SIMPLE_PAGE_V2"]) .v2-detail {
      display: block;
      margin: -12px 0 24px;
      color: #455475;
      line-height: 1.6;
    }
    @media (max-width: 420px) { main { padding: 30px 22px; } }
  </style>
</head>
<body>
  <main>
    <p class="label">CODYSSEY · E1-1</p>
    <h1>개발 작업실</h1>
    <p class="intro">Docker로 실행한 첫 웹 페이지입니다.<br>이 문구를 수정하며 변경이 반영되는 과정을 실습합니다.</p>
    <p class="version" id="mount-marker" data-version="SIMPLE_PAGE_V2">페이지 버전: 2</p>
    <p class="v2-detail">업데이트된 화면입니다. 밝은 배경과 보라색 버전 표시로 V1과 구분할 수 있습니다.</p>
    <footer>
      터미널로 실행하고, 결과를 GitHub에 기록합니다.<br>
      <a href="/principles.html">동작 원리 살펴보기 (선택)</a>
    </footer>
  </main>
</body>
</html>
